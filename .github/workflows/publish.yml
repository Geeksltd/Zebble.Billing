name: Publishes a new package of Zebble.Billing to the nuget.org
on:
  push:
    branches: [ master ]
jobs:
  build_server:
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        configuration: [ Release ]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Install Zebble's CLI tools
      run: dotnet tool install --global zebble-build

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-1
      with:
        user: GeeksLtd

    - name: Publish a new Zebble.Billing.Server package
      run: zebble-build update-plugin --api-key ${{ steps.nuget-login-1.outputs.NUGET_API_KEY }} --publish
      working-directory: Billing.Server
      continue-on-error: true

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-2
      with:
        user: GeeksLtd

    - name: Publish a new Zebble.Billing.Server.AppStore package
      run: zebble-build update-plugin --api-key ${{ steps.nuget-login-2.outputs.NUGET_API_KEY }} --publish
      working-directory: Billing.Server.AppStore
      continue-on-error: true

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-3
      with:
        user: GeeksLtd

    - name: Publish a new Zebble.Billing.Server.GooglePlay package
      run: zebble-build update-plugin --api-key ${{ steps.nuget-login-3.outputs.NUGET_API_KEY }} --publish
