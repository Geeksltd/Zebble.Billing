      continue-on-error: true

    - name: Authenticate to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login-5
      with:
        user: GeeksLtd

    - name: Publish a new Zebble.Billing.Server.Huawei package
      run: zebble-build update-plugin --api-key ${{ steps.nuget-login-5.outputs.NUGET_API_KEY }} --publish
      working-directory: Billing.Server.Huawei
